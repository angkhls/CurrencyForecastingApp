version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: currency_postgres
    environment:
      POSTGRES_DB: currencydb
      POSTGRES_USER: currency_user
      POSTGRES_PASSWORD: currency_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U currency_user -d currencydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ../forecasting
      dockerfile: Dockerfile
    container_name: currency_ml
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: currency_backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/currencydb
      SPRING_DATASOURCE_USERNAME: currency_user
      SPRING_DATASOURCE_PASSWORD: currency_pass
      ML_SERVICE_URL: http://ml-service:8000
      NBRB_API_URL: https://api.nbrb.by/exrates

volumes:
  pgdata: